; ÖV-Abfahrtstafel – ESP32 + 2.0" ST7789V (240x320)
[platformio]
default_envs = esp32dev

[env]
platform = espressif32 @ ^6.9.0
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    bblanchon/ArduinoJson @ ^7.2.0
    ricmoo/QRCode @ ^0.0.1
build_unflags = -Os
build_flags =
    -O2
    -D CORE_DEBUG_LEVEL=0
    -D GITHUB_REPO=\"gelberjupiter/abfahrtstafel\"
    -D USER_SETUP_LOADED=1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_GFXFF=1

[env:esp32dev]
board = esp32dev
upload_speed = 115200
upload_port = /dev/cu.usbserial-0001
monitor_port = /dev/cu.usbserial-0001
build_flags =
    ${env.build_flags}
    -D ST7789_DRIVER=1
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D SPI_FREQUENCY=40000000
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=17
    -D TFT_DC=16
    -D TFT_RST=4

; ESP32-S3 (16 MB Flash, 8 MB PSRAM) + 1.8" ST7735 (160x128), BLK an GPIO 13
[env:esp32s3]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
upload_speed = 460800
build_flags =
    ${env.build_flags}
    -D BOARD_HAS_PSRAM
    -D LCD_SMALL=1
    -D ST7735_DRIVER=1
    -D ST7735_BLACKTAB=1
    -D TFT_WIDTH=128
    -D TFT_HEIGHT=160
    -D SPI_FREQUENCY=27000000
    -D TFT_BL=13
    -D TFT_BACKLIGHT_ON=HIGH
    -D FW_ASSET=\"firmware-esp32s3.bin\"
    -D USE_FSPI_PORT=1
    -D TFT_MOSI=11
    -D TFT_SCLK=12
    -D TFT_CS=10
    -D TFT_DC=9
    -D TFT_RST=8
